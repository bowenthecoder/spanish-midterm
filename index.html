<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#4255ff">
<title>Spanish Midterm</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#282e3e;--muted:#646f90;--brand:#4255ff;--brand2:#e8ebff;--good:#18ae79;--goodbg:#e6f8f1;--bad:#e2453c;--badbg:#fdecea;--line:#d9dde8;--r:16px;--sh:0 2px 12px rgba(40,46,62,.08)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 48px}
header{display:flex;align-items:center;gap:8px;margin-bottom:12px;min-height:40px}
header h1{font-size:20px;margin:0;flex:1}
header .x{background:none;font-size:20px;color:var(--muted);padding:6px 8px}
header .muted{font-size:14px;font-weight:600}
h2{font-size:17px;margin:22px 0 10px}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;color:inherit}
.btn{background:var(--brand);color:#fff;padding:14px 18px;font-weight:600}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.btn.good{background:var(--good)}
.btn.bad{background:var(--card);color:var(--bad);border:2px solid var(--bad)}
.link{background:none;color:var(--brand);font-weight:600;padding:8px 0}
.muted{color:var(--muted)}.center{text-align:center}
.panel{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:var(--sh)}
.between{display:flex;justify-content:space-between;align-items:center;gap:12px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--good);border-radius:99px;transition:width .4s}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.mode{background:var(--card);padding:18px;text-align:left;border-radius:var(--r);box-shadow:var(--sh);border:2px solid transparent;display:flex;flex-direction:column;gap:6px}
.mode:hover{border-color:var(--brand)}
.mode .ic{font-size:28px}.mode b{font-size:18px}.mode small{color:var(--muted)}
.seg{display:flex;background:var(--line);padding:4px;border-radius:12px;gap:4px}
.seg button{flex:1;padding:10px;background:none;color:var(--muted);font-weight:600;border-radius:9px}
.seg button.on{background:var(--card);color:var(--brand);box-shadow:var(--sh)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--card);border:2px solid var(--line);padding:8px 12px;border-radius:99px;font-size:14px}
.chip small{color:var(--muted);margin-left:4px}
.grp{background:none;font-weight:700;font-size:14px;color:var(--ink);padding:14px 0 8px;display:block}
.grp::after{content:' · tap to pick all';font-weight:400;color:var(--muted)}
.mode.wide{grid-column:1/-1;background:var(--brand);color:#fff}.mode.wide small{color:#dfe3ff}
.g h2{margin-top:28px}.g h3{font-size:15px;margin:16px 0 8px}.g ul,.g ol{padding-left:20px}.g li{margin:6px 0}
.g table{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden;box-shadow:var(--sh);font-size:15px}
.g th,.g td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.g th{background:var(--brand2)}
.g td:first-child{color:var(--muted)}.g td b{color:var(--brand)}.g s{color:var(--bad)}
.plan li{margin:10px 0}.plan .btn{padding:6px 10px;font-size:14px;margin-right:4px}.gpanel h2{margin-top:0}
.chip.on{border-color:var(--brand);background:var(--brand2);color:var(--brand)}
.flip{position:relative;height:300px;perspective:1200px;margin:16px 0;cursor:pointer;user-select:none;-webkit-user-select:none}
.flip .inner{position:absolute;inset:0;transition:transform .45s;transform-style:preserve-3d}
.flip.on .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border-radius:var(--r);box-shadow:0 4px 18px rgba(40,46,62,.12);display:flex;align-items:center;justify-content:center;padding:28px;text-align:center}
.face.b{transform:rotateY(180deg)}
.face .txt{font-size:clamp(22px,5vw,32px);font-weight:600}
.hint{position:absolute;bottom:12px;left:0;right:0;color:var(--muted);font-size:13px}
.spk{position:absolute;top:12px;right:12px;background:var(--brand2);width:44px;height:44px;border-radius:50%;font-size:20px}
.spk.inline{position:static;width:34px;height:34px;font-size:15px;vertical-align:middle;margin-left:6px}
.sort{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.keys{font-size:13px;margin-top:14px}
.q{background:var(--card);border-radius:var(--r);padding:22px;box-shadow:var(--sh);margin:16px 0;position:relative}
.q .label{color:var(--muted);font-size:14px;font-weight:600;margin-bottom:12px}
.q .txt{font-size:clamp(20px,4.5vw,26px);font-weight:600;padding-right:48px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{background:var(--card);border:2px solid var(--line);padding:14px;text-align:left;display:flex;gap:12px;align-items:center;min-height:62px}
.opt:hover:not(:disabled){border-color:var(--brand)}
.opt .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:13px;color:var(--muted)}
.opt.right{border-color:var(--good);background:var(--goodbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt.dim{opacity:.45}
.foot{min-height:64px;margin-top:16px}
.inp{width:100%;font:inherit;font-size:20px;padding:14px 16px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);outline:none}
.inp:focus{border-color:var(--brand)}
.acc{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.ak{background:var(--card);border:2px solid var(--line);width:40px;height:40px;font-size:18px;border-radius:10px}
.wf .between{margin-top:12px}
.res{border-radius:var(--r);padding:16px;display:grid;gap:10px}
.res.good{background:var(--goodbg);color:#0d6e4c}
.res.bad{background:var(--badbg)}
.res s{color:var(--bad)}
.big{font-size:48px}
.alt{font-size:14px;margin-top:8px}
.stack{display:flex;flex-direction:column;gap:10px;max-width:320px;margin:16px auto 0}
.review{list-style:none;padding:0;margin:16px 0}
.review li{background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:8px;display:grid;gap:2px;border-left:4px solid var(--line)}
.review li.ok{border-left-color:var(--good)}.review li.no{border-left-color:var(--bad)}
.review span{color:var(--muted)}.review i{font-size:12px;color:var(--muted);font-style:normal}
@media(max-width:560px){.opts,.modes{grid-template-columns:1fr}.flip{height:260px}}
</style>
</head>

const pickVoice = () => { const v = speechSynthesis.getVoices(); esVoice = v.find(x => /^es[-_](ES|MX|US)/i.test(x.lang)) || v.find(x => /^es/i.test(x.lang)) || null; };

function say(t) {

  speechSynthesis.cancel();

}

// Lenient typed-answer check: ignores case, punctuation, (notes), a leading "to ", accents and small typos.
const stripAcc = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '');
const clean = s => s.toLowerCase().replace(/\([^)]*\)/g, ' ').replace(/['’]/g, '').split('/')
  .map(p => p.replace(/[¿?¡!.,;:"“”—–…_\-]/g, ' ').replace(/\s+/g, ' ').trim().replace(/^to /, '')).filter(Boolean).join(' ');
function lev(a, b) {
  let prev = Array.from({length: b.length + 1}, (_, j) => j);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i];
    for (let j = 1; j <= b.length; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[b.length];
}
// Accepted answers: any ";" alternative, and for Spanish the extra forms, the masculine or feminine of o/a words and optional (words).
function variants(c) {
  const out = new Set([A(c), ...A(c).split(';').map(s => s.trim()).filter(Boolean)]);
  if (!esFirst(c)) {
    c.alt.forEach(a => out.add(a));
    for (const p of [...out]) {
      const parts = p.split(',').map(s => s.trim());
      if (parts.length > 1 && parts.every(s => s.split(' ').length <= 2)) parts.forEach(s => out.add(s));
    }
    for (const p of [...out]) {
      out.add(p.replace(/\b(el|los)\/(la|las)\b/g, '$1').replace(/\/(as|a|es)\b/g, ''));
      out.add(p.replace(/[()]/g, ''));
      out.add(p.replace(/\b(el|los)\/(la|las)\b/g, '$2').replace(/o\/a\b/g, 'a').replace(/os\/as\b/g, 'as').replace(/\(a\)/g, 'a'));
    }
  }
  return [...out];
}

function grade(typed, ans) {
  const t = clean(typed), a = clean(ans);
  if (t === a) return {ok: true};
  const ta = stripAcc(t), aa = stripAcc(a);
  if (ta === aa) return {ok: true, note: 'Watch the accents'};
  if (aa.length > 4 && lev(ta, aa) <= Math.floor(aa.length / 8)) return {ok: true, note: 'Close, check the spelling'};
  return {ok: false};
}

const GUIDE = "<div class=\"g\">\n<section class=\"panel gpanel\">\n  <h2>🎯 Midterm: Monday 10/26 · Lessons 1–3</h2>\n  <p>The quizzes so far have had listening, vocab and grammar, and a short writing section, so expect the same. Exam verbs from class: <b>all -ar verbs</b> (estudiar, hablar, practicar), <b>-er/-ir verbs</b> (comer, correr, abrir, escribir), plus <b>tener, venir, ser, estar</b>. Past tense is not on it.</p>\n  <h3>Cram plan (do these in order)</h3>\n  <ol class=\"plan\">\n    <li>Read this page once, top to bottom.</li>\n    <li><button class=\"btn small\" data-study=\"Grammar · Conjugation drill\">Conjugation drill</button> Every exam verb in every form. Most of the points are here.</li>\n    <li><button class=\"btn small\" data-study=\"Class · Rules|Class · Sentences\">Class notes (Oct 19)</button> What the professor stressed.</li>\n    <li><button class=\"btn small\" data-study=\"@L1|@L2|@L3\">Lessons 1–3 vocab</button> First Spanish → English, then switch to English → Spanish.</li>\n    <li><button class=\"btn small\" data-study=\"L1 · Telling time|L1 · Clock practice|L1 · Numbers 0–30\">Time & numbers</button> and <button class=\"btn small\" data-study=\"Speaking · Introduce yourself|Speaking · Practice sentences\">Speaking</button></li>\n  </ol>\n</section>\n\n<h2>1. Present tense endings</h2>\n<table><tr><th></th><th>-ar <small>hablar</small></th><th>-er <small>comer</small></th><th>-ir <small>vivir</small></th></tr>\n<tr><td>yo</td><td>habl<b>o</b></td><td>com<b>o</b></td><td>viv<b>o</b></td></tr>\n<tr><td>tú</td><td>habl<b>as</b></td><td>com<b>es</b></td><td>viv<b>es</b></td></tr>\n<tr><td>él / ella / usted</td><td>habl<b>a</b></td><td>com<b>e</b></td><td>viv<b>e</b></td></tr>\n<tr><td>nosotros</td><td>habl<b>amos</b></td><td>com<b>emos</b></td><td>viv<b>imos</b></td></tr>\n<tr><td>ellos / ellas / ustedes</td><td>habl<b>an</b></td><td>com<b>en</b></td><td>viv<b>en</b></td></tr></table>\n<ul>\n  <li><b>-er and -ir are the same except nosotros:</b> nosotros com<b>emos</b> vs. nosotros viv<b>imos</b>.</li>\n  <li><b>Vosotros</b> (Spain's \"you all\": habláis, coméis, vivís, tenéis) is not tested, but you get credit if you use it correctly.</li>\n  <li>To negate, put <b>no</b> before the verb: <i>No hablo francés.</i></li>\n</ul>\n\n<h2>2. The irregular verbs you need</h2>\n<table><tr><th></th><th>ser</th><th>estar</th><th>tener</th><th>venir</th></tr>\n<tr><td>yo</td><td>soy</td><td>estoy</td><td>tengo</td><td>vengo</td></tr>\n<tr><td>tú</td><td>eres</td><td>estás</td><td>tienes</td><td>vienes</td></tr>\n<tr><td>él / ella / usted</td><td>es</td><td>está</td><td>tiene</td><td>viene</td></tr>\n<tr><td>nosotros</td><td>somos</td><td>estamos</td><td>tenemos</td><td>venimos</td></tr>\n<tr><td>ellos / ellas / ustedes</td><td>son</td><td>están</td><td>tienen</td><td>vienen</td></tr></table>\n<p class=\"muted\">Vosotros, not tested: sois, estáis, tenéis, venís. Venir follows the same pattern as tener: veng<b>o</b>, v<b>ie</b>nes, v<b>ie</b>ne, venimos, v<b>ie</b>nen.</p>\n\n<h2>3. Ser or estar?</h2>\n<table><tr><th>ser = what / who</th><th>estar = where / how</th></tr>\n<tr><td>Origin: <i>Soy de Boston.</i></td><td>Location: <i>La biblioteca está al lado de la cafetería.</i></td></tr>\n<tr><td>Description: <i>Mi hermano es alto.</i></td><td>Health and feelings: <i>Estoy bien, gracias.</i></td></tr>\n<tr><td>Profession: <i>Ella es doctora.</i></td><td></td></tr>\n<tr><td>Time: <i>Son las dos.</i></td><td></td></tr></table>\n<p><b>Origin vs. where you live:</b> <i>Mis primos <b>son de</b> España pero <b>viven en</b> Argentina.</i> (ser de = where they're from; vivir en = where they live now)</p>\n<p><b>Location words (with estar):</b> al lado de (next to), a la derecha de / a la izquierda de (to the right / left of), cerca de (near), lejos de (far from), delante de (in front of), detrás de (behind), encima de (on top of), debajo de (below), entre (between), en (in, on), sobre (on, over), con (with), sin (without), allí / allá (there / over there).</p>\n\n<h2>4. Tener: age and expressions</h2>\n<ul>\n  <li><b>Age always uses tener, never ser:</b> <i>Tengo 20 años.</i> Never say <s>Soy 20 años</s>.</li>\n  <li><b>veintiún años</b>, not <s>veintiuno años</s>: <i>uno</i> drops the -o before a noun (un libro, veintiún años, treinta y un estudiantes).</li>\n  <li>Asking age: <i>¿Cuántos años tienes?</i> (you) · <i>¿Cuántos años tiene?</i> (he/she/you formal) · <i>¿Cuántos años tienen?</i> (they) · <i>¿Cuántos años tenemos?</i> (we)</li>\n  <li><b>tener + noun</b> = \"to be ___\": tener hambre (hungry), sed (thirsty), sueño (sleepy), frío (cold), calor (hot), prisa (in a hurry), miedo de (afraid of), cuidado (careful), suerte (lucky), razón (right), no tener razón (wrong). Add <i>mucho/mucha</i> for \"very\": <i>Tengo mucha hambre.</i></li>\n  <li><b>tener que + verb</b> = have to: <i>Tengo que estudiar.</i> · <b>tener ganas de + verb</b> = feel like: <i>Tengo ganas de descansar.</i></li>\n</ul>\n\n<h2>5. Possessive adjectives</h2>\n<table><tr><th>one thing</th><th>more than one</th><th>meaning</th></tr>\n<tr><td>mi</td><td>mis</td><td>my</td></tr>\n<tr><td>tu</td><td>tus</td><td>your (informal)</td></tr>\n<tr><td>su</td><td>sus</td><td>his / her / its / your (formal) / their</td></tr>\n<tr><td>nuestro / nuestra</td><td>nuestros / nuestras</td><td>our</td></tr></table>\n<ul>\n  <li>The possessive <b>matches the thing owned</b>, not the owner: <i><b>Nuestras</b> raquetas</i> (raquetas is feminine plural) · <i><b>Nuestras</b> fotos aparecen en el periódico</i> (foto is feminine even though it ends in -o) · <i><b>nuestros</b> primos</i>.</li>\n  <li><b>tú</b> (with an accent) = you · <b>tu</b> (no accent) = your: <i>Tú tienes tu libro.</i></li>\n</ul>\n\n<h2>6. Verb notes from class</h2>\n<ul>\n  <li><b>asistir a</b> = to attend, and it always takes <b>a</b>: <i>Asisto <b>a</b> clase los lunes y los viernes.</i></li>\n  <li>-er/-ir verbs: comer (eat), beber (drink), correr (run), leer (read), aprender (learn), comprender (understand), creer en (believe in), deber + verb (should), abrir (open), escribir (write), vivir (live), compartir (share), asistir a (attend), recibir (receive), decidir (decide), describir (describe).</li>\n  <li>-ar verbs: estudiar, hablar, practicar, trabajar, tomar, bailar, buscar (look for), caminar, cantar, cenar, comprar, contestar, conversar, desayunar, descansar, desear, dibujar, enseñar, escuchar, esperar, explicar, llegar, llevar, mirar, necesitar, preguntar, preparar, regresar, terminar, viajar.</li>\n  <li><b>gustar:</b> <i>Me gusta</i> + one thing or a verb (<i>Me gusta bailar</i>) · <i>Me gustan</i> + plural things (<i>Me gustan las clases</i>) · <i>¿Te gusta…?</i> · <i>Le gusta…</i></li>\n</ul>\n\n<h2>7. Nouns, articles and adjectives</h2>\n<ul>\n  <li><b>the:</b> el / la / los / las · <b>a, some:</b> un / una / unos / unas</li>\n  <li>-o is usually masculine (el libro), -a is usually feminine (la mesa). Exceptions: <i>el problema, el mapa, el día, el programa</i>; <i>la mano, la foto</i>. Words ending in -dad or -ción are feminine (la universidad, la lección).</li>\n  <li>Plurals: add -s after a vowel (libro → libros), -es after a consonant (profesor → profesores). Exception: lápiz → lápi<b>ces</b>.</li>\n  <li>Adjectives go <b>after</b> the noun and match it: <i>la chica alta, los chicos altos, las profesoras simpáticas</i>. Adjectives ending in -e or a consonant only add -s / -es: <i>inteligente → inteligentes</i>, <i>difícil → difíciles</i>.</li>\n  <li>Nationalities ending in a consonant add -a for feminine: <i>español → española, francés → francesa, alemán → alemana</i>.</li>\n  <li><b>hay</b> = there is / there are: <i>Hay veinte estudiantes en la clase.</i> · <i>No hay</i> = there isn't / aren't.</li>\n</ul>\n\n<h2>8. Questions</h2>\n<ul>\n  <li>¿Qué? (what) · ¿Quién / Quiénes? (who) · ¿Dónde? (where) · ¿Adónde? (to where) · ¿De dónde? (from where) · ¿Cuándo? (when) · ¿Cómo? (how) · ¿Por qué? (why), answered with <i>porque</i> (because) · ¿Cuánto/a? (how much) · ¿Cuántos/as? (how many) · ¿Cuál / Cuáles? (which) · ¿De quién? (whose)</li>\n  <li>Three ways to ask a yes/no question: <i>¿Hablas español?</i> (raise your voice) · <i>¿Hablas tú español?</i> (flip the subject and verb) · <i>Hablas español, ¿verdad? / ¿no?</i> (add a tag)</li>\n</ul>\n\n<h2>9. Telling time</h2>\n<ul>\n  <li><i>¿Qué hora es?</i> → <b>Es la una</b> (only for 1:00–1:59) · <b>Son las</b> dos, tres… (every other hour)</li>\n  <li>Minutes after the hour: <b>y</b> (<i>Son las dos y diez</i> = 2:10). Minutes before: <b>menos</b> (<i>Son las tres menos diez</i> = 2:50).</li>\n  <li><b>y cuarto</b> / y quince = :15 · <b>y media</b> / y treinta = :30 · <b>menos cuarto</b> = :45 (<i>Son las nueve menos cuarto</i> = 8:45) · <b>en punto</b> = on the dot</li>\n  <li>With a clock time: <b>de la</b> mañana / tarde / noche (<i>a las ocho de la mañana</i>). In general, with no clock time: <b>por la</b> mañana (<i>Estudio por la tarde</i>).</li>\n  <li><i>Es mediodía</i> (noon) · <i>Es medianoche</i> (midnight) · <i>¿A qué hora es la clase?</i> → <i>La clase es <b>a las</b> once y media.</i></li>\n</ul>\n\n<h2>10. Numbers</h2>\n<ul>\n  <li>0–15: cero, uno, dos, tres, cuatro, cinco, seis, siete, ocho, nueve, diez, once, doce, trece, catorce, quince</li>\n  <li>16–29 are one word: dieciséis, diecisiete, dieciocho, diecinueve, veinte, veintiuno, veintidós, veintitrés… veintinueve</li>\n  <li>31 and up use <b>y</b>: treinta y uno, cuarenta y cinco. Tens: treinta, cuarenta, cincuenta, sesenta, setenta, ochenta, noventa, cien (100).</li>\n  <li><b>uno</b> becomes <b>un</b> before a masculine noun and <b>una</b> before a feminine one: <i>veintiún años, veintiuna personas</i>.</li>\n</ul>\n\n<h2>11. Days</h2>\n<ul>\n  <li>lunes, martes, miércoles, jueves, viernes, sábado, domingo (no capital letters)</li>\n  <li><b>el lunes</b> = on Monday (this one) · <b>los lunes</b> = on Mondays (every week). You don't need \"en\": <i>Tengo clase los lunes y los miércoles.</i></li>\n  <li><i>¿Qué día es hoy? Hoy es martes.</i> · hoy (today) · mañana (tomorrow) · ayer (yesterday)</li>\n</ul>\n\n<h2>12. Greetings and introductions</h2>\n<table><tr><th>informal (tú)</th><th>formal (usted)</th></tr>\n<tr><td>¿Cómo estás?</td><td>¿Cómo está usted?</td></tr>\n<tr><td>¿Cómo te llamas? Me llamo…</td><td>¿Cómo se llama usted?</td></tr>\n<tr><td>¿De dónde eres? Soy de…</td><td>¿De dónde es usted?</td></tr>\n<tr><td>¿Y tú?</td><td>¿Y usted?</td></tr>\n<tr><td>Te presento a…</td><td>Le presento a…</td></tr></table>\n<p>Answers: (Muy) bien, gracias · Regular · Nada · No muy bien. Meeting someone: Mucho gusto · Encantado/a · El gusto es mío · Igualmente. Goodbyes: Adiós · Hasta luego · Hasta mañana · Hasta pronto · Nos vemos · Chau. Polite phrases: Por favor · (Muchas) gracias · De nada · No hay de qué · Perdón · Con permiso · Lo siento.</p>\n\n<h2>13. Writing section: a paragraph you can adapt</h2>\n<p class=\"panel\"><i>Hola, me llamo Bowen. Soy de ___ y vivo en Wellesley. Tengo veinte años. Soy estudiante en Babson. Estudio negocios y español. Asisto a clase los lunes y los miércoles a las once y media. Mi familia es pequeña: tengo un hermano y dos primos. Mi madre es simpática y trabajadora. Mis primos son de España pero viven en Argentina. Nosotros comemos en la cafetería y estudiamos en la biblioteca. Me gusta escuchar música. ¡Hasta luego!</i></p>\n<p class=\"muted center\">Questions you can't answer? Tap the buttons in the cram plan at the top to drill that topic.</p>\n</div>\n";
function guide() {
  screen++; onKey = null;
  app.innerHTML = topBar('Study guide') + GUIDE;
  window.scrollTo(0, 0);
  app.querySelectorAll('[data-study]').forEach(b => b.onclick = () => {
    S.secs = b.dataset.study.split('|').flatMap(s => s[0] === '@' ? SECTIONS.filter(x => group(x) === s.slice(1)) : [s]);
    save(); learn();
  });
}

function flash(list) {
  screen++;
  const cards = shuffle([...(list || selected())]), known = [], learning = [];
  let i = 0;
  const draw = () => {
    if (i >= cards.length) return end();
    const c = cards[i], es = esFirst(c);
    app.innerHTML = `${topBar('Flashcards', `${i + 1} / ${cards.length}`)}
    <div class="bar"><i style="width:${i / cards.length * 100}%"></i></div>
    <div class="flip" id="card"><div class="inner">
      <div class="face"><div class="txt">${esc(P(c))}</div>${es ? spk(c.es) : ''}<small class="hint">Tap card to flip</small></div>
      <div class="face b"><div><div class="txt">${esc(A(c))}</div>${altLine(c)}</div>${es ? '' : spk(c.es)}</div>
    </div></div>
    <div class="sort"><button class="btn bad" id="no">✗ Still learning</button><button class="btn good" id="yes">✓ Know it</button></div>
    <p class="muted center keys">Space: flip · ←: still learning · →: know it · or swipe the card</p>`;
    const card = $('card');
    const flip = () => card.classList.toggle('on');
    const mark = once(k => { (k ? known : learning).push(c); i++; draw(); });
    card.onclick = flip;
    $('yes').onclick = () => mark(true);
    $('no').onclick = () => mark(false);
    let x0 = null;
    card.ontouchstart = e => { x0 = e.touches[0].clientX; };
    card.ontouchend = e => {
      if (x0 == null) return;
      const dx = e.changedTouches[0].clientX - x0; x0 = null;
      if (Math.abs(dx) > 60) { e.preventDefault(); mark(dx > 0); }
    };
    onKey = e => {
      if ([' ', 'Enter', 'ArrowUp', 'ArrowDown'].includes(e.key)) { e.preventDefault(); flip(); }
      else if (e.key === 'ArrowRight') mark(true);
      else if (e.key === 'ArrowLeft') mark(false);
    };
  };
  const end = () => {
    const again = once(() => flash(learning));
    onKey = e => { if (e.key === 'Enter') learning.length ? again() : home(); };
    app.innerHTML = `${topBar('Flashcards')}
    <section class="panel center"><div class="big">${learning.length ? '💪' : '🎉'}</div>
      <h2>${known.length} known · ${learning.length} still learning</h2>
      <p class="muted">${learning.length ? `Go through the ${learning.length} you're still learning again.` : 'You know every card in this set!'}</p>
      <div class="stack">${learning.length ? `<button class="btn" id="again">Study ${learning.length} again</button>` : ''}
        <button class="btn ghost" id="toLearn">Go to Learn mode</button><button class="btn ghost" data-home>Home</button></div>
    </section>
    ${learning.length ? `<ul class="review">${learning.map(c => `<li class="no"><b>${esc(c.es)}</b><span>${esc(c.en)}</span></li>`).join('')}</ul>` : ''}`;
    if (learning.length) $('again').onclick = again;
    $('toLearn').onclick = learn;
  };
  draw();
}

function learn() {
  const my = ++screen;
  let queue = [], q = 0, results = new Map(), requeued = new Set();
  const head = () => {
    const cs = selected(), m = cs.filter(c => level(c) >= 2).length;
    return `${topBar('Learn', `${m} / ${cs.length} mastered`)}<div class="bar"><i style="width:${m / cs.length * 100}%"></i></div>`;
  };
  const qbox = (c, label) => `<div class="q"><div class="label">${label}</div><div class="txt">${esc(P(c))}</div>${esFirst(c) ? spk(c.es) : ''}</div>`;
  const newRound = () => {
    const pool = selected().filter(c => level(c) < 2);
    if (!pool.length) return finished();
    // Finish cards already in progress before starting new ones, 7 per round like Quizlet.
    queue = shuffle([...shuffle(pool.filter(c => level(c) === 1)), ...shuffle(pool.filter(c => level(c) === 0))].slice(0, 7));
    q = 0; results = new Map(); requeued = new Set();
    ask();
  };
  const ask = () => {
    if (q >= queue.length) return roundEnd();
    const c = queue[q];
    level(c) === 0 ? mc(c) : written(c);
  };
  const advance = () => { q++; ask(); };
  const hit = c => { if (!results.has(c)) results.set(c, true); };
  const miss = c => { results.set(c, false); if (!requeued.has(c)) { requeued.add(c); queue.push(c); } };

  const mc = c => {
    const ans = A(c);
    const same = shuffle(DECK.filter(d => d.sec === c.sec).map(A)), rest = shuffle(DECK.map(A));
    const twins = twinAnswers(c); // cards sharing this prompt, e.g. Perdón / Con permiso, are never wrong options
    const opts = shuffle([ans, ...[...new Set([...same, ...rest])].filter(o => !twins.includes(o)).slice(0, 3)]);
    app.innerHTML = `${head()}${qbox(c, 'Choose the answer')}
    <div class="opts">${opts.map((o, k) => `<button class="opt"><span class="n">${k + 1}</span><span>${esc(o)}</span></button>`).join('')}</div>
    <div class="foot" id="foot"><button class="link" id="dk">Don't know?</button></div>`;
    const btns = [...app.querySelectorAll('.opt')], next = once(advance);
    const pick = once(k => {
      btns.forEach((b, j) => { b.disabled = true; b.classList.add(opts[j] === ans ? 'right' : j === k ? 'wrong' : 'dim'); });
      if (opts[k] === ans) {
        hit(c); setLevel(c, c.fixed && A(c).length > 40 ? 2 : 1); // long rule cards are too wordy to type
        $('foot').innerHTML = `<div class="res good"><b>✓ ${praise()}</b></div>`;
        setTimeout(() => { if (my === screen) next(); }, 800);
        onKey = null;
      } else {
        miss(c); setLevel(c, 0);
        $('foot').innerHTML = `<div class="res bad"><div>${k < 0 ? "Here's the answer:" : 'Not quite. The answer is:'} <b>${esc(ans)}</b>${spk(c.es, 'inline')}</div>
          <div class="between"><span class="muted">You'll see this again.</span><button class="btn" id="cont">Continue</button></div></div>`;
        $('cont').onclick = next;
        onKey = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); next(); } };
      }
    });
    btns.forEach((b, k) => b.onclick = () => pick(k));
    $('dk').onclick = () => pick(-1);
    onKey = e => { const n = +e.key; if (n >= 1 && n <= opts.length) pick(n - 1); };
  };

  const written = c => {
    const ans = A(c), toEs = !esFirst(c) || c.sec === 'Grammar · Conjugation drill'; // the drill's answers are Spanish forms
    app.innerHTML = `${head()}${qbox(c, toEs ? 'Type it in Spanish' : 'Type it in English')}
    <form id="f" class="wf" autocomplete="off">
      <input id="inp" class="inp" placeholder="Type the answer" autocapitalize="off" autocorrect="off" spellcheck="false" lang="${toEs ? 'es' : 'en'}">
      ${toEs ? `<div class="acc">${[...'áéíóúñü¿¡'].map(ch => `<button type="button" class="ak">${ch}</button>`).join('')}</div>` : ''}
      <div class="between"><button type="button" class="link" id="dk">Don't know?</button><button class="btn">Answer</button></div>
    </form>
    <div class="foot" id="foot"></div>`;
    const inp = $('inp'), next = once(advance);
    inp.focus();
    onKey = null;
    app.querySelectorAll('.ak').forEach(b => b.onclick = () => {
      const s = inp.selectionStart ?? inp.value.length, e = inp.selectionEnd ?? s;
      inp.value = inp.value.slice(0, s) + b.textContent + inp.value.slice(e);
      inp.focus(); inp.setSelectionRange(s + 1, s + 1);
    });
    const result = (typed) => {
      const g = typed == null ? {ok: false} : gradeAny(typed, DECK.filter(d => P(d) === P(c)).flatMap(variants));
      $('f').remove();
      onKey = e => { if (e.key === 'Enter') { e.preventDefault(); next(); } };
      if (g.ok) {
        hit(c); setLevel(c, 2);
        $('foot').innerHTML = `<div class="res good"><b>✓ ${praise()}</b>${g.note ? `<div>${g.note}: <b>${esc(g.a)}</b>${spk(c.es, 'inline')}</div>
          <div class="between"><span></span><button class="btn good" id="cont">Continue</button></div>` : ''}</div>`;
        if (g.note) $('cont').onclick = next;
        else setTimeout(() => { if (my === screen) next(); }, 800);
        return;
      }
      miss(c); setLevel(c, 1);
      $('foot').innerHTML = `<div class="res bad">
        ${typed == null ? "<b>Here's the answer</b>" : `<b>Not quite</b><div>You typed: <s>${esc(typed)}</s></div>`}
        <div>Correct: <b>${esc(ans)}</b>${spk(c.es, 'inline')}</div>${altLine(c)}
        <div class="between">${typed == null ? '<span></span>' : '<button class="link" id="ov">Override: I was right</button>'}<button class="btn" id="cont">Continue</button></div></div>`;
      $('cont').onclick = next;
      if (typed != null) $('ov').onclick = () => {
        results.set(c, true); setLevel(c, 2);
        const extra = queue.lastIndexOf(c);
        if (extra > q) queue.splice(extra, 1);
        next();
      };
    };
    $('f').onsubmit = e => { e.preventDefault(); if (inp.value.trim()) result(inp.value); };
    $('dk').onclick = () => result(null);
  };

  const roundEnd = () => {
    const cs = selected(), m = cs.filter(c => level(c) >= 2).length;
    if (m === cs.length) return finished();
    const right = [...results.values()].filter(Boolean).length, go = once(newRound);
    app.innerHTML = `${head()}<section class="panel center"><div class="big">🔥</div>
      <h2>Round done: ${right} of ${results.size} right the first time</h2>
      <p class="muted">${cs.length - m} cards left to master. Keep going!</p>
      <button class="btn" id="cont">Continue</button></section>
    <ul class="review">${[...results.keys()].map(c => `<li class="${results.get(c) ? 'ok' : 'no'}"><b>${esc(c.es)}</b><span>${esc(c.en)}</span>
      <i>${level(c) >= 2 ? '✓ Mastered' : level(c) === 1 ? 'Next: type it' : 'Keep practicing'}</i></li>`).join('')}</ul>`;
    $('cont').onclick = go;
    onKey = e => { if (e.key === 'Enter') go(); };
  };

  const finished = () => {
    onKey = null;
    const other = S.dir === 'es-en' ? 'English → Spanish' : 'Spanish → English';
    app.innerHTML = `${topBar('Learn')}<section class="panel center"><div class="big">🎉</div>
      <h2>You mastered all ${selected().length} cards!</h2>
      <p class="muted">${S.dir === 'es-en' ? 'Now flip it and practice saying them in Spanish.' : 'You can say all of these in Spanish now. ¡Excelente!'}</p>
      <div class="stack"><button class="btn" id="sw">Learn ${other}</button><button class="btn ghost" id="redo">Learn these again</button><button class="btn ghost" data-home>Home</button></div></section>`;
    $('sw').onclick = () => { S.dir = S.dir === 'es-en' ? 'en-es' : 'es-en'; save(); learn(); };
    $('redo').onclick = () => { selected().forEach(c => delete S.lv[lk(c)]); save(); learn(); };
  };
  newRound();
}

home();
</script>
</body>
</html>
